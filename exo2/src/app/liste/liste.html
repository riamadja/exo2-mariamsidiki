<div class="container text-center my-4">





  <ul class="list-group list-group-flush d-inline-block text-start mb-4">
    @for (film of films; track film.titre) {
      <li class="list-group-item" style="cursor: pointer;" (click)="selectionnerFilm(film)">
        <a class="text-decoration-none">{{ film.titre }}</a>
      </li>
    }
  </ul>

  <hr>

  @if (filmSelectionne) {
    <div class="detail-film mt-4 p-3 border rounded shadow-sm d-inline-block bg-light">
      <h3>{{ filmSelectionne.titre }}</h3>
      <img [src]="filmSelectionne.affiche" [alt]="filmSelectionne.titre" style="max-width: 300px; height: auto;" class="rounded mt-2">
    </div>
  }

</div>
